name: REICA Pages - integrate current PhotoCraft upstream
on:
  push:
    branches: [feature/reica-mangalab-pages-20261116]
    paths: [".github/workflows/reica-pages-upstream.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Merge upstream and preserve REICA custom feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "REICA Upstream Integration"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/storytold/photocraft.git
          git fetch --no-tags upstream main
          echo "Upstream HEAD $(git rev-parse upstream/main)"
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            git merge --no-ff --no-commit --strategy=ort -X ours upstream/main || true
            if git ls-files -u | grep -q .; then
              while IFS= read -r -d '' file; do
                echo "Conflict: $file"
                if git cat-file -e ":2:$file" 2>/dev/null; then
                  git checkout --ours -- "$file"
                  git add -- "$file"
                elif git cat-file -e ":3:$file" 2>/dev/null; then
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                else
                  git rm -f -- "$file"
                fi
              done < <(git diff --name-only --diff-filter=U -z)
            fi
            test -z "$(git ls-files -u)"
            test -f .git/MERGE_HEAD
            git commit -m "merge: upstream PhotoCraft into REICA MangaLab Pages"
          fi
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet -- Cargo.lock; then
            git add Cargo.lock
            git commit -m "build: update upstream Cargo.lock"
          fi
      - name: Check text UI and engine
        run: cargo check -p photocraft-ui-egui -p photocraft-engine -p photocraft-reica
      - name: Publish compatible integration
        run: git push origin HEAD:refs/heads/feature/reica-mangalab-pages-20261116
