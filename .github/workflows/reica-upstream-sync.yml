name: REICA Upstream Port Verification
on:
  push:
    branches:
      - feature/reica-mangalab-upstream-20261106
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reica-upstream-verification
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged upstream + MangaLab
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Regenerate lock file after merge and commit it
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "REICA Upstream Integration"
          git config user.email "actions@users.noreply.github.com"
          cargo metadata --format-version 1 --no-deps > /dev/null
          if ! git diff --quiet -- Cargo.lock; then
            git add Cargo.lock
            git commit -m "build(reica): regenerate Cargo.lock for merged upstream"
            git push origin HEAD:refs/heads/feature/reica-mangalab-upstream-20261106
          fi
      - name: Check MangaLab UI against new PhotoCraft
        run: cargo check --locked -p photocraft-ui-egui
