name: REICA Pages - format edited Rust sources
on:
  push:
    branches: [feature/reica-mangalab-pages-20261116]
    paths:
      - .github/workflows/reica-pages-fmt.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: |
          set -euo pipefail
          cargo fmt --all
          git status --short
          git add crates/ui-egui/src/text_library.rs crates/engine/src/cmd.rs crates/engine/src/cmd/manga_pages_cmds.rs
          if ! git diff --cached --quiet; then
            git config user.name "REICA Rustfmt"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "style(reica): rustfmt MangaLab Pages code"
            git push origin HEAD:refs/heads/feature/reica-mangalab-pages-20261116
          fi
